        <text x="78" y="90" text-anchor="end" font-size="12" fill="#3d3832">100</text><rect x="114" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="140" y="86" width="22" height="200" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="138" y="308" text-anchor="middle" font-size="13" fill="#241f1a">attack</text><text x="138" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+100 poin</text><text x="138" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><rect x="196" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="222" y="86" width="22" height="200" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="220" y="308" text-anchor="middle" font-size="13" fill="#241f1a">defense</text><text x="220" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+100 poin</text><text x="220" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><rect x="278" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="304" y="86" width="22" height="200" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="302" y="308" text-anchor="middle" font-size="13" fill="#241f1a">economy</text><text x="302" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+100 poin</text><text x="302" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><rect x="360" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="386" y="86" width="22" height="200" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="384" y="308" text-anchor="middle" font-size="13" fill="#241f1a">balanced</text><text x="384" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+100 poin</text><text x="384" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><text x="690" y="64" text-anchor="middle" font-size="18" fill="#241f1a">hard</text><line x1="530" y1="286" x2="870" y2="286" stroke="#e4ddd2"/>
        <text x="522" y="290" text-anchor="end" font-size="12" fill="#3d3832">0</text><line x1="530" y1="186" x2="870" y2="186" stroke="#e4ddd2"/>
        <text x="522" y="190" text-anchor="end" font-size="12" fill="#3d3832">50</text><line x1="530" y1="86" x2="870" y2="86" stroke="#e4ddd2"/>
        <text x="522" y="90" text-anchor="end" font-size="12" fill="#3d3832">100</text><rect x="558" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="584" y="252.6" width="22" height="33.4" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="582" y="308" text-anchor="middle" font-size="13" fill="#241f1a">attack</text><text x="582" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+16,7 poin</text><text x="582" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><rect x="640" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="666" y="252.6" width="22" height="33.4" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="664" y="308" text-anchor="middle" font-size="13" fill="#241f1a">defense</text><text x="664" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+16,7 poin</text><text x="664" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><rect x="722" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="748" y="252.6" width="22" height="33.4" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="746" y="308" text-anchor="middle" font-size="13" fill="#241f1a">economy</text><text x="746" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+16,7 poin</text><text x="746" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text><rect x="804" y="283" width="22" height="3" fill="#c4b8a8" stroke="#241f1a" stroke-width="0.6"/><rect x="830" y="152.6" width="22" height="133.4" fill="#2a6f4e" stroke="#241f1a" stroke-width="0.6"/><text x="828" y="308" text-anchor="middle" font-size="13" fill="#241f1a">balanced</text><text x="828" y="326" text-anchor="middle" font-size="12" fill="#3d3832">+66,7 poin</text><text x="828" y="344" text-anchor="middle" font-size="11" fill="#5c564e">n=6/6</text>
  <text x="40" y="372" font-size="13" fill="#5c564e">Batang kiri abu-abu = tanpa repair. Batang kanan hijau = repair jika HP di bawah 80% MaxHP.</text><text x="40" y="390" font-size="13" fill="#5c564e">Angka di bawah batang adalah selisih poin persentase menang. Seed runId sama.</text><text x="40" y="408" font-size="13" fill="#5c564e">Repair memakai gold dan jatah aksi hari itu, jadi upgrade hari itu tertunda.</text><text x="40" y="426" font-size="13" fill="#5c564e">Hard, median wave tempat kalah: attack 2 menjadi 9. defense 3 menjadi 7.</text><text x="40" y="444" font-size="13" fill="#5c564e">Hard, lanjutan: economy 3 menjadi 10. balanced 2,5 menjadi 9.</text><text x="40" y="462" font-size="13" fill="#5c564e">Simulasi strategi otomatis, bukan win rate pemain. Sumbu 0 sampai 100% kemenangan.</text>
</svg>